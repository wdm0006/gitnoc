{% set ep = request.endpoint or '' %}
<nav class="navbar navbar-default app-nav" role="navigation" aria-label="Primary">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-ex1-collapse" aria-label="Toggle navigation">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{url_for('metrics.metrics')}}">
                {{ title }}
            </a>
        </div>
        <div class="collapse navbar-collapse navbar-ex1-collapse">
            <ul class="nav navbar-nav">
                <li{% if ep.startswith('metrics.') %} class="active"{% endif %}><a href="{{url_for('metrics.metrics')}}"{% if ep.startswith('metrics.') %} aria-current="page"{% endif %}>Metrics</a></li>
                <li{% if ep.startswith('blame.') %} class="active"{% endif %}><a href="{{url_for('blame.blame')}}"{% if ep.startswith('blame.') %} aria-current="page"{% endif %}>Blame</a></li>
                <li{% if ep.startswith('risk.') %} class="active"{% endif %}><a href="{{url_for('risk.risk')}}"{% if ep.startswith('risk.') %} aria-current="page"{% endif %}>Risk</a></li>
                <li{% if ep in ('admin.profile', 'admin.settings') %} class="active"{% endif %}><a href="{{url_for('admin.profile')}}">Settings</a></li>
            </ul>
            <ul class="nav navbar-nav navbar-right">
              <li><a class="profile-chip" href="{{url_for('admin.settings')}}"><span class="profile-dot" aria-hidden="true"></span>Current Profile: {{profile_name}}</a></li>
            </ul>
        </div>
    </div>
</nav>
